<path d="M650 400 L950 400 M800 290 L800 480" stroke-width="1.6"/>
<ellipse cx="800" cy="400" rx="46" ry="26" stroke-width="2.2"/>
<ellipse cx="800" cy="400" rx="84" ry="48" stroke-width="2.2"/>
<path d="M680 400 C 726 324, 874 324, 920 400 C 874 476, 726 476, 680 400 Z" stroke-width="2.6"/>
<path d="M666 336 C 742 302, 858 302, 934 336 M666 464 C 742 498, 858 498, 934 464" stroke-width="2" stroke-dasharray="8 7"/>
</g>
